  chemistry:
    label: Chemistry
    keywords:
      - "\\bchemistry\\b|chemical (synthesis|biology)|organic synth|synthetic chem|medicinal chem|drug design|drug discover|lead compounds?\\b|pharmaceutic|\\bformulations?\\b|api manufactur"
      - "analytical chem|mass spectrom|chromatograph|spectroscop|\\bnmr\\b|\\bforensic|electrochem"
      - "materials chem|physical chem|polymer chem|polymer synth|biopolymer|nanomaterial|nanoparticle|graphene|porous material|metal-organic framework|zeolite"
      - "\\bcatalys|photocatal|electrocatal|green chem|sustainable chem|\\bsolvents?\\b|flow chem"
