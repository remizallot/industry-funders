    ukri_topics:
      - "Biomaterials|Medical Devices|Biosensor|Drug Delivery|Imaging|Tissue Engineering"

# Innovate UK sectors that are included without a keyword test. Projects in
# other sectors are included only if a theme keyword matches the title or
# public description.
innovate_uk_sectors_always:
  - "Ageing Society, Health & Nutrition"
  - "Life and Land"
  - "Life Sciences Lvl3"
  - "Engineering Biology lvl3"
  - "Vaccine Development"
  - "Advanced Manufacturing - Agri Tech lvl3"
  - "Energy and Environment"

# GtR lead funders whose projects are included without a keyword test
# (their remit lies inside the School's); other funders need a subject,
# topic or keyword match.
gtr_funders_always:
  - "BBSRC"
  - "NERC"
  - "MRC"

# GtR lead funders outside the School's remit: included only when a UKRI
# research subject or topic maps to a theme (title keywords are not enough).
gtr_funders_subject_only:
  - "AHRC"
  - "ESRC"

