# Research themes of the School of Biological and Chemical Sciences (former
# Departments of Life Sciences and Natural Sciences). Each theme has regular
# expressions matched, case-insensitively, against project titles and
# abstracts, and lists of UKRI research subjects and topics that map to it.
# Matching is inclusion-first: a record is kept if any theme matches.

themes:
  biomedical_health:
    label: Biomedical and health sciences
    keywords:
      - "infection|infectious|pathogen|antimicrobial|antibiotic|antifungal|antiviral|sepsis|virolog|bacteri|parasit"
      - "cardiovascular|vascular|cardiac|heart|atheroscler|thrombo|stroke|hypertens"
      - "ageing|aging|lifelong health|frailty|sarcopenia|dementia|alzheimer|parkinson"
      - "neuroscien|neuron|neurodegenerat|neuroinflamm|synap"
      - "stem cell|regenerative|tissue engineer|organoid|wound heal"
      - "genetic|genomic|epigenet|gene expression|transcriptom|crispr|sequencing"
      - "physiolog|endocrin|metabol|diabet|obesity|nutrition|dietary|gut microbio"
      - "haematolog|hematolog|blood scien|anaemia|leukaemia|lymphoma|platelet"
      - "cancer|tumour|tumor|oncolog|carcinoma|metasta"
      - "immun|inflamm|vaccine|antibod|cytokine|allerg"
      - "bioinformatic|computational biology|systems biology|biomedical data|proteomic|metabolomic"
      - "biomarker|point-of-care|immunoassay"
    ukri_subjects:
      - "Medical & health interface"
      - "Biological sciences"
    ukri_topics:
      - "Medical Microbiology|Microbiology|Virology|Infection|Immunology|Cardiovascular|Neuroscience|Genetics|Genomics|Haematology|Cancer|Oncology|Stem Cell|Regenerative|Ageing|Nutrition|Metabolism|Physiology|Pharmacology|Drug Discovery|Diagnostics|Bioinformatics|Systems Biology|Cell Biology|Molecular"

  molecular_biotech:
