# Research themes of the School of Biological and Chemical Sciences (former
# Departments of Life Sciences and Natural Sciences). Each theme has regular
# expressions matched, case-insensitively, against project titles and
# abstracts, and lists of UKRI research subjects and topics that map to it.
# Matching is inclusion-first: a record is kept if any theme matches.

themes:
  # Keywords are regular expressions matched case-insensitively. A theme is
  # tagged when a UKRI subject or topic maps to it, when a keyword matches the
  # title, or when at least two different keywords match the abstract or
  # public description. Word boundaries (\b) stop "aging" matching "imaging".
  biomedical_health:
    label: Biomedical and health sciences
    keywords:
      - "\\binfections?\\b|\\binfectious\\b|\\bpathogen(s|ic|esis)?\\b|antimicrobial|antibiotics?\\b|antifungal|antiviral|\\bsepsis\\b|\\bvirolog|\\bvirus(es)?\\b|\\bviral\\b|\\bparasit"
      - "cardiovascular|\\bvascular\\b|\\bcardiac\\b|atheroscler|thrombo|\\bstroke\\b|hypertens"
      - "\\bageing\\b|\\baging\\b|lifelong health|\\bfrailty\\b|sarcopenia|\\bdementia\\b|alzheimer|parkinson"
      - "neuroscien|\\bneurons?\\b|neurodegenerat|neuroinflamm|\\bsynap"
      - "stem cells?\\b|regenerative medicine|tissue engineer|organoids?\\b|wound heal"
      - "\\bgenetics?\\b|\\bgenomics?\\b|epigenet|gene expression|transcriptom|crispr|genome sequencing"
      - "\\bphysiolog|\\bendocrin|metabolic (disease|syndrome|health)|\\bdiabet|\\bobesity\\b|\\bnutrition(al)?\\b|\\bdietary\\b|gut microbio"
      - "haematolog|hematolog|blood scien|\\banaemia\\b|leukaemia|lymphoma|\\bplatelets?\\b"
      - "\\bcancers?\\b|\\btumou?rs?\\b|\\boncolog|carcinoma|metasta"
      - "\\bimmun(e|ity|olog|otherap)|\\binflammat|\\bvaccin|\\bantibod(y|ies)\\b|cytokine|\\ballerg"
      - "bioinformatic|computational biology|systems biology|\\bproteomic|\\bmetabolomic"
      - "\\bbiomarkers?\\b|point-of-care|immunoassay"
    ukri_subjects:
      - "Medical & health interface"
      - "Biological sciences"
    ukri_topics:
      - "Medical Microbiology|Microbiology|Virology|Infection|Immunology|Cardiovascular|Neuroscience|Genetics|Genomics|Haematology|Cancer|Oncology|Stem Cell|Regenerative|Ageing|Nutrition|Metabolism|Physiology|Pharmacology|Drug Discovery|Diagnostics|Bioinformatics|Systems Biology|Cell Biology|Molecular"

  molecular_biotech:
    label: Molecular biosciences and biotechnology
    keywords:
      - "molecular biolog|cell biolog|\\bproteins?\\b|\\benzym|\\bbiochem|metabolic engineer|structural biolog"
      - "\\bmicrobiolog|\\bmicrobial\\b|\\bmicrobes?\\b|fermentation|\\byeasts?\\b|\\bfungal\\b|\\bfungi\\b|\\bbacteri(a|al|um)\\b|\\barchaea|microbiome|biofilms?\\b"
      - "synthetic biolog|engineering biolog|biotechnolog|bioprocess|biomanufactur|bioreactor|biocatalys|biosynthe"
      - "industrial biotech|biorefin|bio-based|biofuels?\\b|bioethanol|biopolymer|bioplastic"
      - "food scien|food safety|food technolog|agri-?food|\\bagricultur|\\bcrops?\\b|crop scien|plant scien|livestock|poultry|aquacultur|\\bdairy\\b"
      - "natural products?\\b|secondary metabolit|antibiotic discovery|cytochrome|\\bp450\\b|\\bsterols?\\b|\\blipids?\\b"
    ukri_subjects:
      - "Biological sciences"
      - "Agri-environmental science"
    ukri_topics:
      - "Biochemistry|Biotechnology|Microbiology|Synthetic Biology|Industrial Biotechnology|Bioprocess|Enzyme|Protein|Food Science|Agri|Plant Science|Crop|Microbial|Fermentation|Structural Biology|Molecular Biology|Cell Biology|Metabolic"

  ecology_conservation:
    label: Organismal biology, ecology and conservation
    keywords:
      - "\\becolog|\\becosystems?\\b|biodivers|conservation biolog|\\bhabitats?\\b|\\bwildlife\\b|rewilding|restoration ecolog|invasive species|endangered species"
      - "evolutionary biolog|molecular evolution|evolution of (species|life|populations|behaviou?r)|animal behaviou?r|\\bzoolog|ornitholog|entomolog|pollinators?\\b|amphibians?\\b|reptiles?\\b|fisheries|\\bprimates?\\b"
