      - "molecular biolog|cell biolog|cellular|protein|enzym|biochem|metabolic engineer|structural biolog"
      - "microbio|microbial|fermentation|yeast|fungal|fungi|bacterial|archaea|microbiome|biofilm"
      - "synthetic biolog|engineering biolog|biotechnolog|bioprocess|biomanufactur|bioreactor|biocatalys|biosynthe"
      - "industrial biotech|biorefin|bio-based|biofuel|bioethanol|biopolymer|bioplastic"
