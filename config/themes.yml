      - "nature-based solution|natural capital|ecosystem services?\\b|wildlife disease"
    ukri_subjects:
      - "Ecology, biodiversity & systematics"
      - "Terrestrial & freshwater environment"
      - "Marine environments"
      - "Biological sciences"
    ukri_topics:
      - "Ecology|Biodiversity|Conservation|Evolution|Behaviour|Population Ecology|Community Ecology|Ecosystem|Plant Science|Animal|Zoology|Ornithology|Entomology|Marine|Freshwater|Environmental Microbiology"

  environmental_earth:
