  crosscutting:
    label: Cross-cutting and facility-led
    keywords:
      - "biomaterials?\\b|medical devices?\\b|\\bimplants?\\b|\\bscaffolds?\\b|hydrogels?\\b|drug delivery|nanomedicine"
      - "in vitro diagnostic|biosensors?\\b|lateral flow|point of care"
      - "machine learning for (drug|protein|molecul|genom)|ai-driven drug|protein language model"
      - "fuel cell innovation|core analytical|print city"
    ukri_subjects: []
    ukri_topics:
      - "Biomaterials|Medical Devices|Biosensor|Drug Delivery|Tissue Engineering"

# Innovate UK sectors that are included without a keyword test. Projects in
# other sectors are included only if a theme keyword matches the title or
# public description.
innovate_uk_sectors_always:
  - "Ageing Society, Health & Nutrition"
  - "Life and Land"
  - "Life Sciences Lvl3"
  - "Engineering Biology lvl3"
  - "Vaccine Development"
  - "Advanced Manufacturing - Agri Tech lvl3"
  - "Energy and Environment"

# GtR lead funders whose projects are included without a keyword test
# (their remit lies inside the School's); other funders need a subject,
# topic or keyword match.
gtr_funders_always:
  - "BBSRC"
  - "NERC"
  - "MRC"

# GtR lead funders outside the School's remit: included only when a UKRI
# research subject or topic maps to a theme (title keywords are not enough).
gtr_funders_subject_only:
  - "AHRC"
  - "ESRC"

# Organisation classes, matched case-insensitively against organisation
# names. academic_patterns are removed from the partner side altogether
# (universities, NHS, councils, government departments' own research bodies
# are the hosts, not the funders). The other classes are kept in the data
# and flagged in org_type so the explorer can list them on request.

# Dropped: universities, colleges, NHS, research councils, local government
academic_patterns:
  - "universit|\\bcollege\\b|school of|polytechnic|politecnico|universidad|universit[aà]|universiteit|hochschule|école|ecole|eth z|\\bepfl\\b|\\bkaist\\b|medical school|royal college"
  - "\\bnhs\\b|hospital|primary care|clinical commissioning|\\bccg\\b|health board|foundation trust|\\bgp\\b|\\bmhra\\b|\\bnice\\b"
  - "research council|\\bukri\\b|\\bepsrc\\b|\\bbbsrc\\b|\\bnerc\\b|\\bmrc\\b|\\bahrc\\b|\\besrc\\b|\\bstfc\\b|innovate uk|research england"
  - "city council|county council|\\bcouncil\\b|borough|combined authority|greater manchester|transport for|local enterprise|\\blep\\b|chamber of commerce|growth hub|\\bcic\\b|community interest"

