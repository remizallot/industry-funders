# Runs the pipeline in a container. Used by scripts/run_in_docker.sh.
#   docker compose run --rm pipeline bash scripts/run_all.sh
#   docker compose run --rm pipeline python scripts/08_merge_all.py
services:
  pipeline:
    build: .
    volumes:
      - ./data:/work/data
      - ./config:/work/config
      - ./scripts:/work/scripts
      - ./industry-funders-plan.pdf:/work/industry-funders-plan.pdf:ro
    working_dir: /work
    environment:
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
